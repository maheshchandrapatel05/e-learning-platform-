<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | WeLearN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary:      #6366f1;
      --primary-dark: #4338ca;
      --primary-light:#e0e7ff;
      --bg-primary:   #f8f9fc;
      --bg-secondary: #f1f3f7;
      --bg-elevated:  #ffffff;
      --text-primary: #0f172a;
      --text-secondary:#475569;
      --text-muted:   #94a3b8;
      --border-light: #e2e8f0;
      --border-medium:#cbd5e1;
      --accent-red:   #ef4444;
      --shadow-sm:    0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
      --shadow-md:    0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);
      --shadow-lg:    0 10px 24px rgba(0,0,0,.1),  0 4px 8px rgba(0,0,0,.04);
      --shadow-xl:    0 20px 40px rgba(0,0,0,.12), 0 8px 16px rgba(0,0,0,.06);
      --topbar-h:     72px;
      --subbar-h:     53px;
      --weekbar-h:    48px;
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family:'DM Sans', system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp   { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:none} }
    @keyframes slideDown{ from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:none} }
    .fade-in { animation: fadeUp .55s cubic-bezier(.16,1,.3,1) both; }

    /* ══════════════════════════════════════════
       TOP BAR
    ══════════════════════════════════════════ */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 300;
      height: var(--topbar-h);
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      gap: 1.5rem;
    }

    .brand {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.625rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -.03em;
      white-space: nowrap;
      flex-shrink: 0;
      text-decoration: none;
    }

    /* Search bar — centre of topbar */
    .topbar-search {
      flex: 1;
      max-width: 420px;
      position: relative;
      display: flex;
      align-items: center;
    }
    .topbar-search svg {
      position: absolute;
      left: .875rem;
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      pointer-events: none;
      transition: color .2s;
    }
    .topbar-search:focus-within svg { color: var(--primary); }

    #searchInput {
      width: 100%;
      padding: .5625rem 1rem .5625rem 2.625rem;
      border: 1.5px solid var(--border-light);
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: .9rem;
      color: var(--text-primary);
      background: var(--bg-secondary);
      outline: none;
      transition: all .25s cubic-bezier(.4,0,.2,1);
    }
    #searchInput::placeholder { color: var(--text-muted); }
    #searchInput:focus {
      border-color: var(--primary);
      background: var(--bg-elevated);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    /* Right side nav */
    .topbar-nav {
      display: flex;
      align-items: center;
      gap: .625rem;
      flex-shrink: 0;
    }
    .nav-link {
      text-decoration: none;
      color: var(--text-secondary);
      font-weight: 500;
      font-size: .9rem;
      padding: .45rem 1rem;
      border-radius: 10px;
      transition: all .2s;
      white-space: nowrap;
    }
    .nav-link:hover, .nav-link.active {
      color: var(--primary);
      background: var(--primary-light);
    }
    .nav-link.active { font-weight: 600; }

    .btn-logout {
      padding: .45rem 1.125rem;
      background: var(--bg-secondary);
      color: var(--text-secondary);
      border: 1.5px solid var(--border-light);
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: .875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .22s;
      white-space: nowrap;
    }
    .btn-logout:hover {
      background: var(--accent-red);
      color: #fff;
      border-color: var(--accent-red);
    }

    /* ══════════════════════════════════════════
       SUBJECT BAR
    ══════════════════════════════════════════ */
    .subject-bar-wrap {
      position: sticky;
      top: var(--topbar-h);
      z-index: 200;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border-light);
      box-shadow: 0 2px 8px -2px rgba(0,0,0,.06);
    }
    .subject-bar {
      max-width: 1280px;
      margin: 0 auto;
      padding: .75rem 2rem;
      display: flex;
      align-items: center;
      gap: .5rem;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .subject-bar::-webkit-scrollbar { display: none; }

    .subject-pill {
      flex-shrink: 0;
      padding: .4375rem 1.125rem;
      border-radius: 999px;
      font-family: 'DM Sans', sans-serif;
      font-size: .875rem;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid var(--border-light);
      background: var(--bg-secondary);
      color: var(--text-secondary);
      transition: all .22s cubic-bezier(.4,0,.2,1);
      white-space: nowrap;
      user-select: none;
    }
    .subject-pill:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
      transform: translateY(-1px);
    }
    .subject-pill.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 14px -3px rgba(99,102,241,.5);
      transform: translateY(-1px);
    }

    .bar-empty {
      font-size: .875rem;
      color: var(--text-muted);
      font-style: italic;
    }

    /* ══════════════════════════════════════════
       WEEK SUB-BAR
    ══════════════════════════════════════════ */
    .week-bar-wrap {
      position: sticky;
      top: calc(var(--topbar-h) + var(--subbar-h));
      z-index: 190;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-light);
      max-height: 0;
      overflow: hidden;
      transition: max-height .3s cubic-bezier(.4,0,.2,1);
    }
    .week-bar-wrap.visible { max-height: var(--weekbar-h); }

    .week-bar {
      max-width: 1280px;
      margin: 0 auto;
      padding: .5rem 2rem;
      display: flex;
      align-items: center;
      gap: .4rem;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .week-bar::-webkit-scrollbar { display: none; }

    .week-label {
      font-size: .7375rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: .05em;
      text-transform: uppercase;
      margin-right: .25rem;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .week-pill {
      flex-shrink: 0;
      padding: .3125rem .9375rem;
      border-radius: 999px;
      font-family: 'DM Sans', sans-serif;
      font-size: .8125rem;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid var(--border-medium);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      transition: all .18s;
      white-space: nowrap;
      user-select: none;
    }
    .week-pill:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
    }
    .week-pill.active {
      background: var(--primary);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 2px 8px -1px rgba(99,102,241,.4);
    }

    /* ══════════════════════════════════════════
       PAGE BODY
    ══════════════════════════════════════════ */
    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 2.5rem 2rem 4rem;
    }

    /* Welcome row */
    .welcome-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .welcome-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -.03em;
      background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
    }
    .stats-row {
      display: flex;
      gap: .75rem;
      flex-wrap: wrap;
    }
    .stat-chip {
      padding: .375rem 1rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      font-size: .8125rem;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
      box-shadow: var(--shadow-sm);
    }
    .stat-chip span { color: var(--primary); }

    /* Breadcrumb */
    .content-header {
      display: none;
      align-items: center;
      gap: .5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      animation: slideDown .25s ease;
    }
    .content-header.visible { display: flex; }
    .bc-subject {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
    }
    .bc-sep { color: var(--text-muted); }
    .bc-week {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .bc-count {
      font-size: .775rem;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      border-radius: 999px;
      padding: .125rem .625rem;
    }

    /* ══════════════════════════════════════════
       CARDS
    ══════════════════════════════════════════ */
    .cards-grid {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-light);
      border-radius: 20px;
      padding: 2rem 2.25rem;
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
      transition: transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .35s ease;
    }
    .card::after {
      content: '';
      position: absolute;
      inset: 0 0 auto 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--primary-dark));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .35s cubic-bezier(.4,0,.2,1);
      border-radius: 20px 20px 0 0;
    }
    .card:hover { transform: translateY(-5px); box-shadow: var(--shadow-xl); }
    .card:hover::after { transform: scaleX(1); }

    /* ══════════════════════════════════════════
       STATES (empty / pick)
    ══════════════════════════════════════════ */
    .empty-state, .pick-state {
      text-align: center;
      padding: 5rem 2rem;
      background: var(--bg-elevated);
      border-radius: 20px;
      border: 1.5px dashed var(--border-medium);
    }
    .empty-state { border-style: solid; box-shadow: var(--shadow-md); }
    .state-icon  { font-size: 4rem; margin-bottom: 1.25rem; opacity: .35; }
    .state-title { font-size: 1.2rem; font-weight: 700; color: var(--text-secondary); margin-bottom: .375rem; }
    .state-text  { color: var(--text-muted); font-size: .9375rem; }

    /* ══════════════════════════════════════════
       RESPONSIVE
    ══════════════════════════════════════════ */
    @media (max-width: 820px) {
      .topbar      { padding: 0 1.25rem; gap: .75rem; }
      .topbar-search { max-width: none; }
      .subject-bar { padding: .625rem 1.25rem; }
      .week-bar    { padding: .5rem 1.25rem; }
      .page        { padding: 1.75rem 1.25rem 3rem; }
      .welcome-title { font-size: 1.75rem; }
      .card        { padding: 1.5rem; }
    }
    @media (max-width: 560px) {
      .stats-row   { display: none; }
      .nav-link    { display: none; }
      .btn-logout  { padding: .45rem .75rem; font-size: .8125rem; }
    }
  </style>
</head>
<body>

<!-- ══ TOP BAR ══ -->
<header class="topbar">
  <a class="brand" href="dashboard.html">🎓 WeLearN</a>

  <div class="topbar-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id="searchInput" type="text" placeholder="Search by subject, topic or keyword…"
           oninput="onSearch(this.value)" autocomplete="off" spellcheck="false">
  </div>

  <nav class="topbar-nav">
    <a href="dashboard.html" class="nav-link active">Dashboard</a>
    <a href="upload.html"    class="nav-link" id="uploadLink">Upload Class</a>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </nav>
</header>

<!-- ══ SUBJECT BAR ══ -->
<div class="subject-bar-wrap">
  <div class="subject-bar" id="subjectBar">
    <span class="bar-empty">No subjects yet — upload a class to get started.</span>
  </div>
</div>

<!-- ══ WEEK SUB-BAR ══ -->
<div class="week-bar-wrap" id="weekBarWrap">
  <div class="week-bar" id="weekBar">
    <span class="week-label">Weeks</span>
  </div>
</div>

<!-- ══ PAGE BODY ══ -->
<main class="page fade-in">

  <div class="welcome-row">
    <h1 class="welcome-title">👋 Welcome back, <span id="userName">Student</span>!</h1>
    <div class="stats-row" id="statsRow"></div>
  </div>

  <div class="content-header" id="contentHeader">
    <span class="bc-subject" id="bcSubject"></span>
    <span class="bc-sep">›</span>
    <span class="bc-week"    id="bcWeek"></span>
    <span class="bc-count"   id="bcCount"></span>
  </div>

  <div id="content"></div>
</main>

<script src="script.js"></script>
<script>
  checkAuth();

  const _role = localStorage.getItem('role');

  /* hide Upload link for students */
  if (_role !== 'teacher') document.getElementById('uploadLink').style.display = 'none';

  /* set greeting name */
  document.getElementById('userName').textContent = _role === 'teacher' ? 'Teacher' : 'Student';

  /* live stats chips */
  function refreshStats() {
    const classes  = getClasses();
    const subjects = [...new Set(classes.map(c => c.subject))].length;
    const row = document.getElementById('statsRow');
    if (!row) return;
    row.innerHTML = `
      <div class="stat-chip">📚 <span>${subjects}</span> Subject${subjects !== 1 ? 's' : ''}</div>
      <div class="stat-chip">🎓 <span>${classes.length}</span> Class${classes.length !== 1 ? 'es' : ''}</div>`;
  }

  setTimeout(() => {
    initDashboard();
    refreshStats();
  }, 80);
</script>

</body>
</html>
