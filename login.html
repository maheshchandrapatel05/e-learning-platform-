<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | WeLearN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-light: #e0e7ff;
      --primary-dark: #4338ca;
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-elevated: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border-light: #e2e8f0;
      --accent-green: #10b981;
      --accent-red: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: absolute;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
      top: -300px;
      right: -300px;
      animation: float 20s ease-in-out infinite;
    }

    body::after {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
      bottom: -200px;
      left: -200px;
      animation: float 25s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(50px, -50px) rotate(120deg); }
      66% { transform: translate(-30px, 30px) rotate(240deg); }
    }

    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.9) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .login-container {
      background: rgba(255, 255, 255, 0.98);
      padding: 3rem;
      width: 100%;
      max-width: 440px;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      animation: fadeInScale 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      z-index: 10;
    }

    .login-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.75rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      letter-spacing: -0.03em;
    }

    .tagline {
      color: var(--text-muted);
      font-size: 0.9375rem;
      font-weight: 400;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
      letter-spacing: -0.01em;
    }

    input, select {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 2px solid var(--border-light);
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9375rem;
      color: var(--text-primary);
      background: var(--bg-elevated);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-light);
      transform: translateY(-2px);
    }

    select {
      cursor: pointer;
      background-image: url("data:image/svg+xml,%3Csvg width='14' height='8' viewBox='0 0 14 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L7 7L13 1' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 1rem center;
      padding-right: 3rem;
      appearance: none;
    }

    .btn-primary {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-top: 0.5rem;
      box-shadow: 0 8px 16px -4px rgba(99, 102, 241, 0.4);
      position: relative;
      overflow: hidden;
    }

    .btn-primary::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.5s;
    }

    .btn-primary:hover::before {
      left: 100%;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px -8px rgba(99, 102, 241, 0.5);
    }

    .btn-primary:active {
      transform: translateY(-1px);
    }

    .footer-text {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .footer-text a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-text a:hover {
      color: var(--primary-dark);
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 2rem;
        margin: 1rem;
      }

      .logo {
        font-size: 2.25rem;
      }
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-header">
    <div class="logo">🎓 WeLearN</div>
    <p class="tagline">Transform your classroom into a digital learning hub</p>
  </div>

  <form onsubmit="login(event)">
    <div class="form-group">
      <label>Select Your Role</label>
      <select id="role" required>
        <option value="student">👨‍🎓 Student</option>
        <option value="teacher">👩‍🏫 Teacher</option>
      </select>
    </div>

    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Enter your username" autocomplete="username" required>
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn-primary">Sign In to Dashboard</button>
  </form>

  <p class="footer-text">
    New to WeLearN? <a href="#">Create an account</a>
  </p>
</div>

<script>
function login(event) {
  event.preventDefault();
  const role = document.getElementById("role").value;
  localStorage.setItem("loggedIn", "true");
  localStorage.setItem("role", role);
  
  document.querySelector('.login-container').style.opacity = '0';
  document.querySelector('.login-container').style.transform = 'scale(0.95)';
  
  setTimeout(() => {
    window.location.href = "dashboard.html";
  }, 300);
}
</script>

</body>
</html>
