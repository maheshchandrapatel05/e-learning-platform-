<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Class | WeLearN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-light: #e0e7ff;
      --primary-dark: #4338ca;
      --bg-primary: #fafbfc;
      --bg-secondary: #f3f4f6;
      --bg-elevated: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border-light: #e2e8f0;
      --border-medium: #cbd5e1;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in {
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .topbar {
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border-light);
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow-sm);
    }

    .brand {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.03em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 0.9375rem;
      padding: 0.5rem 1rem;
      border-radius: 10px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .nav-links a:hover {
      color: var(--primary);
      background: var(--primary-light);
    }

    .nav-links a.active {
      color: var(--primary);
      background: var(--primary-light);
      font-weight: 600;
    }

    .btn-logout {
      background: var(--bg-secondary);
      color: var(--text-primary);
      padding: 0.5rem 1.25rem;
      font-size: 0.875rem;
      border: 1px solid var(--border-light);
      border-radius: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s;
    }

    .btn-logout:hover {
      background: var(--accent-red);
      color: white;
      border-color: var(--accent-red);
      transform: translateY(-2px);
    }

    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 3rem;
      margin-bottom: 3rem;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .card {
      background: var(--bg-elevated);
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-light);
    }

    .section {
      margin-bottom: 2.5rem;
    }

    .section:last-child {
      margin-bottom: 0;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
      margin-top: 1.25rem;
      letter-spacing: -0.01em;
    }

    label:first-of-type {
      margin-top: 0;
    }

    input, textarea, select {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 2px solid var(--border-light);
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9375rem;
      color: var(--text-primary);
      background: var(--bg-elevated);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
    }

    input[type="date"] {
      cursor: pointer;
    }

    input[type="time"] {
      cursor: pointer;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-light);
      transform: translateY(-2px);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
      line-height: 1.6;
    }

    select {
      cursor: pointer;
      background-image: url("data:image/svg+xml,%3Csvg width='14' height='8' viewBox='0 0 14 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L7 7L13 1' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 1rem center;
      padding-right: 3rem;
      appearance: none;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1.5rem;
    }

    .input-with-icon {
      position: relative;
    }

    .input-icon {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.25rem;
      pointer-events: none;
      transition: all 0.3s;
      color: var(--text-muted);
    }

    .input-icon.valid {
      color: var(--accent-green);
      animation: bounce 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .input-icon.invalid {
      color: var(--accent-red);
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(-50%) scale(1); }
      50% { transform: translateY(-50%) scale(1.3); }
    }

    .video-preview-container {
      margin-top: 1.5rem;
      padding: 1.5rem;
      background: var(--bg-secondary);
      border-radius: 16px;
      border: 2px dashed var(--border-medium);
      transition: all 0.3s;
      display: none;
    }

    .video-preview-container.active {
      background: var(--primary-light);
      border-color: var(--primary);
      border-style: solid;
      display: block;
    }

    .preview-label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    iframe {
      width: 100%;
      height: 350px;
      border-radius: 12px;
      box-shadow: var(--shadow-md);
      border: none;
    }

    .btn-primary {
      width: 100%;
      padding: 1.125rem;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-top: 2rem;
      box-shadow: 0 8px 16px -4px rgba(99, 102, 241, 0.4);
      position: relative;
      overflow: hidden;
    }

    .btn-primary::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.5s;
    }

    .btn-primary:hover::before {
      left: 100%;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px -8px rgba(99, 102, 241, 0.5);
    }

    .btn-primary:active {
      transform: translateY(-1px);
    }

    hr {
      border: 0;
      height: 1px;
      background: var(--border-light);
      margin: 2.5rem 0;
    }

    .date-info {
      background: var(--primary-light);
      color: var(--primary-dark);
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.875rem;
      margin-top: 0.5rem;
      font-weight: 500;
      display: none;
    }

    .date-info.show {
      display: block;
    }

    @media (max-width: 768px) {
      .grid-2, .grid-3 {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .page {
        padding: 2rem 1.25rem;
      }

      h1 {
        font-size: 2rem;
      }

      .card {
        padding: 1.5rem;
      }

      iframe {
        height: 250px;
      }
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="brand">🎓 WeLearN</div>
  <div class="nav-links">
    <a href="dashboard.html">Dashboard</a>
    <a href="upload.html" class="active">Upload Class</a>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>
</header>

<div class="page fade-in">
  <h1>📤 Upload New Class</h1>

  <div class="card">
    <div class="section">
      <h3 class="section-title">📅 Class Schedule</h3>
      <div class="grid-3">
        <div>
          <label>Class Date *</label>
          <input type="date" id="classDate" required onchange="updateDateInfo()">
        </div>
        <div>
          <label>Start Time</label>
          <input type="time" id="startTime" value="09:00">
        </div>
        <div>
          <label>Duration (minutes)</label>
          <input type="number" id="duration" placeholder="60" min="15" max="240" value="60">
        </div>
      </div>
      <div class="date-info" id="dateInfo"></div>
    </div>

    <hr>

    <div class="section">
      <h3 class="section-title">📖 Class Information</h3>
      
      <label>Subject Name *</label>
      <input id="subject" placeholder="e.g., Physics, Mathematics, Biology" required>
      
      <label>Topic Title *</label>
      <input id="topic" placeholder="e.g., Newton's Laws of Motion" required>

      <label>Description</label>
      <textarea id="description" placeholder="Brief description of what students will learn in this class..." rows="3"></textarea>
    </div>

    <hr>

    <div class="section">
      <h3 class="section-title">🎥 Learning Resources</h3>
      
      <label>YouTube Video Link</label>
      <div class="input-with-icon">
        <input id="video" placeholder="Paste YouTube URL (any format works)" oninput="previewVideo()">
        <span class="input-icon" id="videoIcon"></span>
      </div>
      
      <div class="video-preview-container" id="previewContainer">
        <div class="preview-label">📺 Video Preview</div>
        <iframe id="videoPreview" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
      </div>

      <label>PDF or Document Link</label>
      <input id="pdf" placeholder="Google Drive link, PDF URL, or any document link">
    </div>

    <hr>

    <div class="section">
      <h3 class="section-title">✍️ Class Summary</h3>
      
      <label>Key Takeaways</label>
      <textarea id="summary" placeholder="Summarize the main points, formulas, or concepts students should remember..." rows="5"></textarea>
    </div>

    <button class="btn-primary" onclick="uploadClass()">📤 Upload Class Content</button>
  </div>
</div>

<script src="script.js"></script>
<script>
protectUploadPage();

// Set min date to today
document.getElementById('classDate').min = new Date().toISOString().split('T')[0];

function updateDateInfo() {
  const dateInput = document.getElementById('classDate');
  const dateInfo = document.getElementById('dateInfo');
  
  if (dateInput.value) {
    const selectedDate = new Date(dateInput.value + 'T00:00:00');
    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    
    const dayName = days[selectedDate.getDay()];
    const monthName = months[selectedDate.getMonth()];
    const day = selectedDate.getDate();
    const year = selectedDate.getFullYear();
    
    dateInfo.textContent = `📅 ${dayName}, ${monthName} ${day}, ${year}`;
    dateInfo.classList.add('show');
  } else {
    dateInfo.classList.remove('show');
  }
}
</script>

</body>
</html>
